name: Improvement
description: Propose a change to the reporting skill, its references, or its scripts.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The concrete task that fails or is hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: An actual run, synthetic example, or acceptance case that shows the difference. Claims about performance need a comparable baseline.
